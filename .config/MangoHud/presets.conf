# -------------------------------
# MANGOHUD PRESETS CONFIGURATION
# -------------------------------
# Swith presets with keybind Shift_R+F10

# PRESET -1 : Hidden HUD / Time
# No overlay shown, useful for toggling off MangoHud without disabling it entirely
# Display time manually, keybind Shift_R+F12
[preset -1]
legacy_layout=0
# TIME
time
time_no_label
# HUD
position=top-center
round_corners=5
hud_no_margin
no_display
table_columns=0

# PRESET 0 : Minimal FPS counter
# Clean overlay showing only FPS, small font, no background margin
[preset 0]
legacy_layout=0
# FPS
fps_only
fps_color_change
# HUD
font_size=12
hud_no_margin
background_alpha=0

# PRESET 1 : Basic performance info
# GPU and CPU stats + RAM, VRAM, FPS and some environment context (Vulkan, Wine, etc.)
[preset 1]
legacy_layout=0
# GPU
gpu_stats
gpu_temp
gpu_core_clock
gpu_power
gpu_text=5700XT
gpu_load_change
# CPU
cpu_stats
cpu_temp
cpu_mhz
cpu_power
cpu_text=5800X
cpu_load_change
# VRAM
vram
# RAM
ram
# ENGINE/FPS
fps
fps_color_change
engine_version
# FRAME
frametime
# DRIVER/SYSTEM
vulkan_driver
wine
custom_text=Kernel
exec=uname -r
# MODES
gamemode
# HUD
round_corners=5

# PRESET 2 : Horizontal compact view
# Cleaner, horizontal layout with most key stats and system info
[preset 2]
legacy_layout=0
# GPU
gpu_stats
gpu_temp
gpu_load_change
# CPU
cpu_stats
cpu_temp
cpu_load_change
# VRAM
vram
# RAM
ram
# ENGINE/FPS
fps
fps_color_change
# FRAME
frametime
frame_timing
# DRIVER/SYSTEM
vulkan_driver
exec=uname -r
# MODES
gamemode
# DISPLAY
resolution
display_server
# HUD
hud_no_margin
horizontal

# PRESET 3 : Extended stats
# Adds power usage, CPU/GPU clock speeds and throttling status for deeper monitoring
[preset 3]
legacy_layout=0
# GPU
gpu_stats
gpu_temp
gpu_core_clock
gpu_power
gpu_text=5700XT
gpu_load_change
# CPU
cpu_stats
cpu_temp
cpu_mhz
cpu_power
cpu_text=5800X
cpu_load_change
# VRAM
vram
# RAM
ram
# ENGINE/FPS
fps
fps_color_change
engine_version
# FRAME
frametime
frame_timing
throttling_status_graph
# DRIVER/SYSTEM
vulkan_driver
wine
custom_text=Kernel
exec=uname -r
# MODES
gamemode
# HUD
round_corners=5

# PRESET 4 : Full info
# Everything enabled — for deep benchmarking or system diagnostics
[preset 4]
legacy_layout=0
# GPU
gpu_stats
gpu_temp
gpu_junction_temp
gpu_fan
gpu_core_clock
gpu_power
gpu_power_limit
gpu_efficiency
gpu_voltage
gpu_text=5700XT
gpu_load_change
# CPU
cpu_stats
cpu_temp
cpu_mhz
cpu_power
cpu_efficiency
cpu_text=5800X
cpu_load_change
core_load
core_load_change
# IO
io_read
io_write
# VRAM
vram
gpu_mem_temp
gpu_mem_clock
proc_vram
# RAM
ram
swap
procmem
procmem_shared
procmem_virt
# ENGINE/FPS
fsr
fps
fps_color_change
engine_version
# FRAME
frametime
frame_timing
frame_timing_detailed
throttling_status_graph
frame_count
# DRIVER/SYSTEM
vulkan_driver
arch
wine
custom_text=Kernel
exec=uname -r
# MODES
gamemode
vkbasalt
# DISPLAY
show_fps_limit
resolution
winesync
present_mode
display_server
# HUD
round_corners=5
